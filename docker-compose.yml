services:
  vocml:
    build: .
    image: vocml:latest
    container_name: vocml
    restart: unless-stopped
    env_file: .env
    ports:
      - "${VOCML_PORT:-8080}:8080"
    volumes:
      # Berisi database SQLite + private key lisensi. WAJIB di-backup.
      - vocml-data:/app/data

  # ---------------------------------------------------------------
  # Integrasi Cloudflare Tunnel
  # ---------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vocml-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    depends_on:
      - vocml

volumes:
  vocml-data:
