services:
  vocml:
    build: .
    image: vocml:latest
    container_name: vocml
    restart: unless-stopped
    env_file: .env
    ports:
      - "${VOCML_PORT:-8080}:8080"
    volumes:
      # Berisi database SQLite + private key lisensi. WAJIB di-backup.
      - vocml-data:/app/data

  # ---------------------------------------------------------------
  # Opsional: HTTPS otomatis dengan Caddy (Let's Encrypt).
  # 1. Arahkan domain (mis. lisensi.domainanda.com) ke IP server.
  # 2. Hapus tanda komentar di bawah, isi domain di file Caddyfile.
  # 3. Ubah port vocml di atas menjadi "127.0.0.1:8080:8080".
  # ---------------------------------------------------------------
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: vocml-caddy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #   depends_on:
  #     - vocml

volumes:
  vocml-data:
  # caddy-data:
